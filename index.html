<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Shelf">
<title>Our Shelf</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6b66;
    --accent: #2f6f5e; --line: #e2dfd6; --danger: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171815; --card: #23251f; --ink: #f2f1ec; --muted: #a3a39b;
      --accent: #6fb59f; --line: #34362f; --danger: #f2b8b5;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px; max-width: 720px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  main { padding: 0 16px 40px; max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 14px; font-size: 15px; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button.small { padding: 4px 10px; font-size: 13px; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  input, select {
    width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 16px; background: var(--bg); color: var(--ink); margin-bottom: 12px;
  }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .tabs button { flex: none; }
  .tabs button.off { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .item {
    display: flex; gap: 12px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: 0; }
  .item .grow { flex: 1; min-width: 0; }
  .thumb {
    width: 52px; height: 52px; border-radius: 10px; object-fit: cover;
    background: var(--line); flex: none;
  }
  .muted { color: var(--muted); font-size: 13px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat { font-size: 22px; font-weight: 600; }
  .chart-box { position: relative; height: 240px; margin-bottom: 20px; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>Our Shelf</h1>
  <button id="signOutBtn" class="ghost small hidden">Sign out</button>
</header>

<main>
  <!-- Sign-in screen -->
  <section id="signInView" class="card hidden">
    <h2>Welcome</h2>
    <p class="muted">Sign in with Google to see your shared list.</p>
    <button id="signInBtn">Sign in with Google</button>
    <p id="authError" class="muted" style="color: var(--danger)"></p>
  </section>

  <!-- Main app -->
  <div id="appView" class="hidden">
    <nav class="tabs">
      <button data-tab="purchases">Purchases</button>
      <button data-tab="products" class="off">Products</button>
      <button data-tab="charts" class="off">Charts</button>
    </nav>

    <!-- Purchases -->
    <section id="tab-purchases">
      <div class="card">
        <h2>Add a purchase</h2>
        <form id="purchaseForm">
          <label for="pProduct">Product</label>
          <select id="pProduct" required></select>

          <div class="row">
            <div>
              <label for="pQty">Quantity</label>
              <input id="pQty" type="number" step="any" min="0.01" value="1" required>
            </div>
            <div>
              <label for="pPrice">Price (£)</label>
              <input id="pPrice" type="number" step="0.01" min="0" inputmode="decimal" required>
            </div>
          </div>

          <label for="pStore">Supermarket (optional)</label>
          <input id="pStore" list="storeList" placeholder="e.g. Tesco" autocomplete="off">
          <datalist id="storeList"></datalist>

          <label for="pDate">Date</label>
          <input id="pDate" type="date" required>

          <button type="submit">Save purchase</button>
          <p id="purchaseMsg" class="muted"></p>
        </form>
      </div>

      <div class="card">
        <h2>Recent purchases</h2>
        <div id="purchaseList"></div>
      </div>
    </section>

    <!-- Products -->
    <section id="tab-products" class="hidden">
      <div class="card">
        <h2>Add a product</h2>
        <form id="productForm">
          <label for="prName">Name</label>
          <input id="prName" required placeholder="e.g. Oat milk">
          <label for="prPhoto">Photo link (optional)</label>
          <input id="prPhoto" type="url" placeholder="https://...">
          <button type="submit">Add product</button>
          <p id="productMsg" class="muted"></p>
        </form>
      </div>

      <div class="card">
        <h2>Your products</h2>
        <div id="productList"></div>
      </div>
    </section>

    <!-- Charts -->
    <section id="tab-charts" class="hidden">
      <div class="card">
        <label for="chartProduct">Show</label>
        <select id="chartProduct"></select>

        <div class="stats">
          <div>
            <div class="muted">Total spent</div>
            <div class="stat" id="totalSpent">£0.00</div>
          </div>
          <div>
            <div class="muted">Total bought</div>
            <div class="stat" id="totalQty">0</div>
          </div>
        </div>

        <h2 id="priceTitle">Price over time</h2>
        <div class="chart-box"><canvas id="priceChart"></canvas></div>
        <p id="priceEmpty" class="empty hidden">Pick a single product to see its price history.</p>

        <h2>Bought per month</h2>
        <div class="chart-box"><canvas id="qtyChart"></canvas></div>
        <p id="qtyEmpty" class="empty hidden">No purchases yet.</p>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  const SUPABASE_URL = 'https://djttpfolfccrwdmadarp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_8zOtpJm8Lv55p_YVRiDXhA_zbXoCULP';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let products = [];
  let purchases = [];
  let priceChart = null;
  let qtyChart = null;

  const $ = (id) => document.getElementById(id);

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function money(n) { return '£' + Number(n || 0).toFixed(2); }
  function todayLocal() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }
  function formatDate(iso) {
    return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  // ---------- Auth ----------
  sb.auth.onAuthStateChange((_event, session) => render(session));

  async function init() {
    $('signInBtn').addEventListener('click', signIn);
    $('signOutBtn').addEventListener('click', () => sb.auth.signOut());
    document.querySelectorAll('[data-tab]').forEach(btn =>
      btn.addEventListener('click', () => showTab(btn.dataset.tab)));
    $('pDate').value = todayLocal();

    const { data: { session } } = await sb.auth.getSession();
    render(session);
  }

  async function signIn() {
    $('authError').textContent = '';
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) $('authError').textContent = error.message;
  }

  async function render(session) {
    if (!session) {
      $('signInView').classList.remove('hidden');
      $('appView').classList.add('hidden');
      $('signOutBtn').classList.add('hidden');
      return;
    }
    $('signInView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    $('signOutBtn').classList.remove('hidden');
    await loadAll();
  }

  // ---------- Tabs ----------
  function showTab(name) {
    ['purchases', 'products', 'charts'].forEach(t => {
      $('tab-' + t).classList.toggle('hidden', t !== name);
    });
    document.querySelectorAll('[data-tab]').forEach(btn =>
      btn.classList.toggle('off', btn.dataset.tab !== name));
    if (name === 'charts') drawCharts();
  }

  // ---------- Data ----------
  async function loadAll() {
    const [p, c] = await Promise.all([
      sb.from('products').select('*').order('name'),
      sb.from('purchases').select('*, products(name, photo_url)').order('bought_on', { ascending: false })
    ]);
    if (p.error || c.error) {
      alert('Could not load data: ' + (p.error || c.error).message);
      return;
    }
    products = p.data;
    purchases = c.data;
    renderAll();
  }

  function renderAll() {
    renderProductOptions();
    renderStores();
    renderPurchases();
    renderProducts();
  }

  function renderProductOptions() {
    const current = $('pProduct').value;
    $('pProduct').innerHTML = products.length
      ? products.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')
      : '<option value="">Add a product first</option>';
    if (current && products.some(p => p.id === current)) $('pProduct').value = current;

    const chartCurrent = $('chartProduct').value;
    $('chartProduct').innerHTML =
      '<option value="all">All products</option>' +
      products.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    if (chartCurrent) $('chartProduct').value = chartCurrent;
  }

  function renderStores() {
    const stores = [...new Set(purchases.map(p => p.supermarket).filter(Boolean))].sort();
    $('storeList').innerHTML = stores.map(s => `<option value="${esc(s)}">`).join('');
  }

  function renderPurchases() {
    const list = $('purchaseList');
    if (!purchases.length) {
      list.innerHTML = '<p class="empty">No purchases yet. Add one above.</p>';
      return;
    }
    list.innerHTML = purchases.slice(0, 50).map(p => {
      const name = p.products ? p.products.name : 'Unknown product';
      const photo = p.products && p.products.photo_url
        ? `<img class="thumb" src="${esc(p.products.photo_url)}" alt="">`
        : '<div class="thumb"></div>';
      const store = p.supermarket ? ` · ${esc(p.supermarket)}` : '';
      return `
        <div class="item">
          ${photo}
          <div class="grow">
            <strong>${esc(name)}</strong>
            <div class="muted">${formatDate(p.bought_on)}${store} · qty ${Number(p.quantity)}</div>
          </div>
          <div>
            <div><strong>${money(p.price)}</strong></div>
            <button class="danger small" data-delete="${p.id}">Delete</button>
          </div>
        </div>`;
    }).join('');

    list.querySelectorAll('[data-delete]').forEach(btn =>
      btn.addEventListener('click', () => deletePurchase(btn.dataset.delete)));
  }

  function renderProducts() {
    const list = $('productList');
    if (!products.length) {
      list.innerHTML = '<p class="empty">No products yet.</p>';
      return;
    }
    list.innerHTML = products.map(p => {
      const latest = purchases.find(x => x.product_id === p.id);
      const photo = p.photo_url
        ? `<img class="thumb" src="${esc(p.photo_url)}" alt="">`
        : '<div class="thumb"></div>';
      const info = latest
        ? `Last paid ${money(latest.price)} on ${formatDate(latest.bought_on)}`
        : 'No purchases yet';
      return `
        <div class="item">
          ${photo}
          <div class="grow">
            <strong>${esc(p.name)}</strong>
            <div class="muted">${info}</div>
          </div>
        </div>`;
    }).join('');
  }

  // ---------- Forms ----------
  $('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('prName').value.trim();
    const photo = $('prPhoto').value.trim() || null;
    const { error } = await sb.from('products').insert({ name, photo_url: photo });
    if (error) { $('productMsg').textContent = error.message; return; }
    $('productForm').reset();
    $('productMsg').textContent = 'Product added.';
    await loadAll();
  });

  $('purchaseForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!products.length) { $('purchaseMsg').textContent = 'Add a product first.'; return; }
    const row = {
      product_id: $('pProduct').value,
      quantity: Number($('pQty').value),
      price: Number($('pPrice').value),
      supermarket: $('pStore').value.trim() || null,
      bought_on: $('pDate').value
    };
    const { error } = await sb.from('purchases').insert(row);
    if (error) { $('purchaseMsg').textContent = error.message; return; }
    $('pPrice').value = '';
    $('pStore').value = '';
    $('pQty').value = '1';
    $('pDate').value = todayLocal();
    $('purchaseMsg').textContent = 'Saved.';
    await loadAll();
  });

  async function deletePurchase(id) {
    if (!confirm('Delete this purchase?')) return;
    const { error } = await sb.from('purchases').delete().eq('id', id);
    if (error) { alert(error.message); return; }
    await loadAll();
  }

  // ---------- Charts ----------
  function drawCharts() {
    const choice = $('chartProduct').value || 'all';
    const rows = purchases
      .filter(p => choice === 'all' || p.product_id === choice)
      .slice()
      .sort((a, b) => a.bought_on.localeCompare(b.bought_on));

    $('totalSpent').textContent = money(rows.reduce((s, r) => s + Number(r.price), 0));
    $('totalQty').textContent = rows.reduce((s, r) => s + Number(r.quantity), 0).toString();

    // Price over time (single product only)
    if (priceChart) priceChart.destroy();
    if (choice === 'all') {
      $('priceTitle').classList.add('hidden');
      $('priceChart').parentElement.classList.add('hidden');
      $('priceEmpty').classList.remove('hidden');
    } else {
      $('priceTitle').classList.remove('hidden');
      $('priceChart').parentElement.classList.remove('hidden');
      $('priceEmpty').classList.add('hidden');
      priceChart = new Chart($('priceChart'), {
        type: 'line',
        data: {
          labels: rows.map(r => formatDate(r.bought_on)),
          datasets: [{
            label: 'Price (£)',
            data: rows.map(r => Number(r.price)),
            borderColor: '#2f6f5e',
            backgroundColor: '#2f6f5e',
            tension: 0.2
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // Quantity bought per month
    if (qtyChart) qtyChart.destroy();
    const byMonth = {};
    rows.forEach(r => {
      const key = r.bought_on.slice(0, 7);
      byMonth[key] = (byMonth[key] || 0) + Number(r.quantity);
    });
    const months = Object.keys(byMonth).sort();
    $('qtyEmpty').classList.toggle('hidden', months.length > 0);
    $('qtyChart').parentElement.classList.toggle('hidden', months.length === 0);
    if (months.length) {
      qtyChart = new Chart($('qtyChart'), {
        type: 'bar',
        data: {
          labels: months.map(m => {
            const [y, mo] = m.split('-');
            return new Date(y, mo - 1, 1).toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
          }),
          datasets: [{
            label: 'Quantity',
            data: months.map(m => byMonth[m]),
            backgroundColor: '#6fb59f'
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }
  }

  $('chartProduct').addEventListener('change', drawCharts);

  init();
</script>
</body>
</html>
